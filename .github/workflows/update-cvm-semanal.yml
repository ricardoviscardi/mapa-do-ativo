name: Atualizar fundamentos CVM semanal

on:
  workflow_dispatch:
  schedule:
    # Sábado, 07:00 BRT aproximado (10:00 UTC).
    - cron: "0 10 * * 6"

permissions:
  contents: write

jobs:
  update-cvm-semanal:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Dependências Python
        run: pip install -r requirements.txt

      - name: Atualizar fundamentos de ações pela CVM
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CVM_FORCE_IPV4: "1"
        run: python scripts/update_cvm_companies.py --all --allow-cvm-unavailable

      - name: Atualizar dados regulatórios de FIIs pela CVM
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CVM_FORCE_IPV4: "1"
        run: python scripts/update_cvm_fiis.py --all

      - name: Exportar snapshot completo
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/export_stock_snapshots.py --all-assets --limit-history 2600

      - name: Verificar cobertura do snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/verify_snapshot_coverage.py || true

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshots reports || true
          if git diff --cached --quiet; then
            echo "Sem alterações para publicar."
          else
            git commit -m "atualiza fundamentos CVM e snapshots"
            git push
          fi
