name: Atualizar FIIs

on:
  workflow_dispatch:
  schedule:
    # Segunda a sexta, 21:30 BRT aproximado (00:30 UTC do dia seguinte).
    - cron: "30 0 * * 2-6"

permissions:
  contents: write

jobs:
  update-fiis:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Dependências Python
        run: pip install -r requirements.txt

      - name: Atualizar preços, histórico e rendimentos de FIIs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BRAPI_API_TOKEN: ${{ secrets.BRAPI_API_TOKEN }}
          CVM_FORCE_IPV4: "1"
        run: python scripts/update_base_inicial.py --fiis --sleep 0.7

      - name: Atualizar dados regulatórios de FIIs pela CVM
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CVM_FORCE_IPV4: "1"
        run: python scripts/update_cvm_fiis.py --all

      - name: Exportar snapshot de FIIs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/export_stock_snapshots.py --all-fiis --limit-history 2600

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshots reports || true
          if git diff --cached --quiet; then
            echo "Sem alterações para publicar."
          else
            git commit -m "atualiza dados de FIIs e snapshots"
            git push
          fi
